const chip = (mask) => `<span class="chip"><i style="background:${esc(elementColor(mask))}"></i>${esc(elementName(mask))}</span>`;

// Spiegelt Skills.element_score / element_multiplier
function elementScore(skillNature, targetType) {
	const strong = DATA.elements.strongAgainst;
	let score = 0;
	for (const a of BASE_MASKS) {
		if (!(skillNature & a)) continue;
		for (const d of BASE_MASKS) {
			if (!(targetType & d)) continue;
			if (strong[a] === d) score++;
			else if (strong[d] === a) score--;
		}
	}
	return score;
}
function elementMultiplier(skillNature, targetType) {
	const score = elementScore(skillNature, targetType);
	const bonus = DATA.elements.elementBonus;
	return score >= 0 ? 1 + bonus * score : Math.pow(1 - bonus, -score);
}
const covers = (typeMask, nature) => (nature & ~typeMask) === 0;

// ─────────────────────────
// Skills

const skillByName = Object.fromEntries(DATA.skills.map((s) => [s.name, s]));
const tierStars = (t) => "◆".repeat(t || 1) + `<span class="muted">${"◇".repeat(Math.max(0, 4 - (t || 1)))}</span>`;
const dmgType = (s) => (s.damage_type === "ABILITY" ? ui("ability") : ui("physical"));
const skillDesc = (s) => tr(s.description, { value: fmtNum(s.value ?? s.damage ?? 0) });
const skillLabel = (name) => {
	const s = skillByName[name];
	return s ? `${chip(s.nature)} <b>${esc(tr(name))}</b> <span class="tier small">${tierStars(s.tier)}</span>` : `<b>${esc(tr(name))}</b>`;
};
function skillWeight(s, depth = 0) {
	const t = s.tier || 1;
	return DATA.tierWeights[t] * Math.pow(1 + DATA.depthTierBonus * depth, t - 1);
}

// ─────────────────────────
// Suche

function matches(...texts) {
	if (!state.query) return true;
	const q = state.query.toLowerCase();
	return texts.some((t) => String(t ?? "").toLowerCase().includes(q));
}
function hl(text) {
	const s = esc(text);
	if (!state.query) return s;
	const q = state.query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
	return s.replace(new RegExp(`(${esc(q)})`, "gi"), "<mark>$1</mark>");
}

// Seiten

const SECTIONS = {
	monsters: { count: () => DATA.mons.length, render: renderMonsters },
	skills: { count: () => DATA.skills.length, render: renderSkills },
	elements: { count: () => DATA.elements.combos.length, render: renderElements },
	gems: { count: () => Object.keys(DATA.gems.stats).length, render: renderGems },
	relics: { count: () => Object.keys(DATA.relics).length, render: renderRelics },
	unlocks: { count: () => DATA.milestones.length + DATA.bounties.length, render: renderUnlocks },
	map: { count: () => Object.keys(DATA.map.settings).length, render: renderMap },
};

function header(key) {
	return `<h2>${esc(ui(key))}</h2><p class="lead">${ui("leads")[key] || ""}</p>`;
}

// Bevorzugte Werteverteilung der Art, Spielwerte heißen im Spiel STAT_*
function statProfile(m) {
	const labels = { hp: "HP", atk: "ATK", def: "DEF", s_atk: "SPA", s_def: "SPD", speed: "SPE" };
	if (!m.preferred_stats) return "";
	return `<div class="skill-group"><h4>${ui("preferredStats")}</h4><div class="stat-row" title="${esc(ui("preferredHint"))}">${
		Object.entries(labels).map(([key, label]) => `<div><span>${esc(tr("STAT_" + label).replace(":", ""))}</span>${m.preferred_stats[key] ?? "–"} %</div>`).join("")}</div></div>`;
}

function renderMonsters() {
	const bountyByKey = Object.fromEntries(DATA.bounties.map((b) => [b.key, b]));
	const msByKey = Object.fromEntries(DATA.milestones.map((m) => [m.key, m]));
	const cards = DATA.mons.filter((m) => {
		const skills = [...(m.default_egg_skills || []), ...(m.unlockable_egg_skills || []),
			...Object.values(m.milestone_egg_skills || {}), ...Object.values(m.bounty_egg_skills || {})];
		return matches(m.name, monName(m.name), elementName(m.initial_type), rarityName(m.rarity), ...skills.map((s) => tr(s)));
	}).map((m) => {
		const list = (names, how) => names.length ? `<ul class="skill-list">${names.map((n, i) =>
			`<li>${skillLabel(n)}${how ? `<span class="how">· ${esc(how(i))}</span>` : ""}</li>`).join("")}</ul>` : `<span class="muted">${ui("none")}</span>`;
		const ms = Object.entries(m.milestone_egg_skills || {});
		const bs = Object.entries(m.bounty_egg_skills || {});
		const catchBase = DATA.catch.rarityBase?.[m.rarity];
		return `<article class="card">
			<div class="row" style="align-items:flex-start">
				<img class="mon-img" src="${esc(res(m.image))}" alt="${esc(monName(m.name))}" loading="lazy" onerror="this.style.visibility='hidden'">
				<div style="min-width:0">
					<h3>${hl(monName(m.name))}</h3>
					<div class="row" style="margin-top:4px">${chip(m.initial_type)} <span class="tag">${esc(rarityName(m.rarity))}</span></div>
					<dl class="kv">
						<dt>${ui("bst")}</dt><dd>${(m.stats || []).join(" – ")}</dd>
						<dt>${ui("maxUpgrades")}</dt><dd>${m.max_upgrades ?? ui("none")}</dd>
						${catchBase != null ? `<dt>${ui("catchBase")}</dt><dd title="${esc(ui("catchHint"))}">${pct(catchBase)}</dd>` : ""}
					</dl>
				</div>
			</div>
			${statProfile(m)}
			<div class="skill-group"><h4>${ui("defaultSkills")}</h4>${list(m.default_egg_skills || [])}</div>
			<div class="skill-group"><h4>${ui("unlockable")}</h4>${list(m.unlockable_egg_skills || [])}</div>
			<div class="skill-group"><h4>${ui("milestone")}</h4>${list(ms.map(([, s]) => s), (i) => {
				const def = msByKey[ms[i][0]];
				return def ? `${def.count}× ${tr("MILESTONE_STAT_" + def.stat.toUpperCase())}` : ms[i][0];
			})}</div>
			<div class="skill-group"><h4>${ui("bounty")}</h4>${list(bs.map(([, s]) => s), (i) => {
				const def = bountyByKey[bs[i][0]];
				return def ? tr(def.label, { mon: monName(def.mon) }) + ` (${ui("depth")} ${def.min_depth + 1}+)` : bs[i][0];
			})}</div>
		</article>`;
	});
	return header("monsters") + (cards.length ? `<div class="grid">${cards.join("")}</div>` : `<div class="empty">${ui("noResults")}</div>`);
}

function renderSkills() {
	const cols = [
		{ key: "name", label: ui("name"), get: (s) => tr(s.name) },
		{ key: "nature", label: ui("element"), get: (s) => elementsIn(s.nature).length * 100 + s.nature },
		{ key: "tier", label: ui("tier"), get: (s) => s.tier || 1 },
		{ key: "value", label: ui("power"), get: (s) => s.value ?? s.damage ?? 0, num: true },
		{ key: "damage_type", label: ui("type"), get: (s) => dmgType(s) },
		{ key: "cost", label: ui("cost"), get: (s) => s.cost, num: true },
		{ key: "cooldown", label: ui("cd"), get: (s) => s.cooldown, num: true },
		{ key: "shop", label: ui("shop"), get: (s) => s.shop_cost?.min ?? 0, num: true },
		{ key: "list", label: ui("source"), get: (s) => DATA.skillLists.indexOf(s.list) },
	];
	const { key, dir } = state.skillSort;
	const col = cols.find((c) => c.key === key) || cols[2];
	const rows = DATA.skills
		.filter((s) => state.skillElement === "all" || (s.nature & Number(state.skillElement)))
		.filter((s) => state.skillList === "all" || s.list === state.skillList)
		.filter((s) => matches(tr(s.name), s.name, elementName(s.nature), skillDesc(s), ui("lists")[s.list]))
		.sort((a, b) => {
			const x = col.get(a), y = col.get(b);
			const c = typeof x === "number" ? x - y : String(x).localeCompare(String(y), state.lang);
			return (dir === "asc" ? c : -c) || (a.tier || 1) - (b.tier || 1) || (a.value ?? 0) - (b.value ?? 0);
		});
	const usable = (s) => DATA.mons.filter((m) => covers(m.initial_type, s.nature)).map((m) => monName(m.name));
	const filters = `<div class="filters">
		<select id="f-element" aria-label="${ui("element")}">
			<option value="all">${ui("element")}: ${ui("all")}</option>
			${BASE_MASKS.map((e) => `<option value="${e}" ${String(e) === state.skillElement ? "selected" : ""}>${esc(elementName(e))}</option>`).join("")}
		</select>
		<select id="f-list" aria-label="${ui("source")}">
			<option value="all">${ui("source")}: ${ui("all")}</option>
			${DATA.skillLists.map((l) => `<option value="${l}" ${l === state.skillList ? "selected" : ""}>${esc(ui("lists")[l] || l)}</option>`).join("")}
		</select>
		<span class="muted small">${rows.length} / ${DATA.skills.length} · ${ui("maxSkills")}: ${DATA.maxSkills ?? "?"}</span>
	</div>`;
	const table = `<div class="table-wrap"><table>
		<thead><tr>${cols.map((c) => `<th class="sortable ${c.num ? "num" : ""}" data-sort="${c.key}" ${c.key === key ? `data-dir="${dir}"` : ""}>${esc(c.label)}</th>`).join("")}
			<th>${ui("desc")}</th><th>${ui("usableBy")}</th></tr></thead>
		<tbody>${rows.map((s) => `<tr>
			<td><b>${hl(tr(s.name))}</b><br><code class="small">${hl(s.name)}</code></td>
			<td>${chip(s.nature)}</td>
			<td class="tier" title="${ui("weight")}: ${fmtNum(skillWeight(s))}">${tierStars(s.tier)}</td>
			<td class="num">${fmtNum(s.value ?? s.damage ?? 0)}</td>
			<td>${dmgType(s)}</td>
			<td class="num">${s.cost ?? ""}</td>
			<td class="num">${s.cooldown ?? ""}</td>
			<td class="num">${s.shop_cost ? `${s.shop_cost.min}–${s.shop_cost.max}` : ""}</td>
			<td><span class="tag">${esc(ui("lists")[s.list] || s.list)}</span></td>
			<td class="wrap">${hl(skillDesc(s))}</td>
			<td class="wrap small">${esc(usable(s).join(", ") || ui("none"))}</td>
		</tr>`).join("")}</tbody></table></div>`;
	const weights = `<p class="small muted" style="margin-top:12px">${ui("tierWeights")}: ${Object.entries(DATA.tierWeights || {}).map(([t, w]) => `${ui("tier")} ${t} = ${w}`).join(" · ")}
		(+${Math.round((DATA.depthTierBonus || 0) * 100)} % / ${ui("depth")} / ${ui("tier")})</p>`;
	return header("skills") + filters + (rows.length ? table : `<div class="empty">${ui("noResults")}</div>`) + weights;
}

function renderElements() {
	const strong = DATA.elements.strongAgainst;
	// Kreis ab dem ersten Element ablaufen
	const cycle = [];
	let cur = BASE_MASKS[0];
	while (cur && !cycle.includes(cur)) { cycle.push(cur); cur = strong[cur]; }
	const cycleHtml = `<div class="card wide"><h3>${ui("strongVs")}</h3><div class="cycle" style="margin-top:8px">${
		cycle.map(chip).join(" <span class='muted'>→</span> ")} <span class="muted">→</span> ${chip(cycle[0])}</div>
		<p class="small muted" style="margin:8px 0 0">+1 → ×${1 + DATA.elements.elementBonus}, +2 → ×${1 + 2 * DATA.elements.elementBonus} · −1 → ×${1 - DATA.elements.elementBonus}, −2 → ×${Math.pow(1 - DATA.elements.elementBonus, 2)}</p></div>`;

	const combos = DATA.elements.combos
		.filter((c) => matches(tr(c.label), c.label, ...elementsIn(c.mask).map(elementName)))
		.sort((a, b) => elementsIn(a.mask).length - elementsIn(b.mask).length || a.mask - b.mask);
	const comboHtml = combos.map((c) => {
		const skills = DATA.skills.filter((s) => s.nature === c.mask);
		const mons = DATA.mons.filter((m) => m.initial_type === c.mask);
		return `<article class="card"><div class="row">
			<div class="swatch" style="background:${esc(c.color)}"></div>
			<div><h3>${hl(tr(c.label))}</h3><div class="small muted">${elementsIn(c.mask).length > 1 ? `${ui("components")}: ${elementsIn(c.mask).map(elementName).join(" + ")}` : esc(c.color)}</div></div>
		</div>
		<dl class="kv">
			<dt>${ui("skills")}</dt><dd>${skills.length ? skills.map((s) => esc(tr(s.name))).join(", ") : ui("none")}</dd>
			<dt>${ui("monsters")}</dt><dd>${mons.length ? mons.map((m) => esc(monName(m.name))).join(", ") : ui("none")}</dd>
		</dl></article>`;
	}).join("");

	const axis = (state.matrixAll ? DATA.elements.combos.map((c) => c.mask) : BASE_MASKS)
		.slice().sort((a, b) => elementsIn(a).length - elementsIn(b).length || a - b);
	const cell = (a, d) => {
		const m = elementMultiplier(a, d);
		const s = Math.min(Math.abs(elementScore(a, d)), 4);
		const cls = m > 1 ? "m-up" : m < 1 ? "m-down" : "m-eq";
		return `<td class="${cls}" style="--s:${s}" title="${esc(elementName(a))} → ${esc(elementName(d))}">×${fmtNum(m)}</td>`;
	};
	const matrix = `<div class="card wide">
		<div class="row"><h3>${ui("matchups")}</h3><div class="spacer"></div>
			<div class="seg" id="matrix-mode">
				<button data-all="0" aria-pressed="${!state.matrixAll}">${ui("onlyBase")}</button>
				<button data-all="1" aria-pressed="${state.matrixAll}">${ui("allCombos")}</button>
			</div></div>
		<div class="table-wrap" style="margin-top:10px;box-shadow:none"><table class="matrix">
			<thead><tr><th class="rowh small">${ui("attacker")}</th>${axis.map((d) => `<th>${chip(d)}</th>`).join("")}</tr></thead>
			<tbody>${axis.map((a) => `<tr><th class="rowh">${chip(a)}</th>${axis.map((d) => cell(a, d)).join("")}</tr>`).join("")}</tbody>
		</table></div></div>`;

	return header("elements") + `<div class="grid">${cycleHtml}${matrix}</div>
		<h3 style="margin:24px 0 10px">${ui("combos")}</h3>
		${combos.length ? `<div class="grid">${comboHtml}</div>` : `<div class="empty">${ui("noResults")}</div>`}`;
}

	const depths = DATA.gems.bonusByDepth;

		.filter(([key, g]) => matches(key, tr(g.name), tr(g.stat)))
		.map(([key, g]) => `<article class="card"><div class="row">
			<div class="swatch" style="background:${rgb(g.color)};background-image:url('${esc(res(DATA.gems.icon))}');background-size:cover;background-blend-mode:multiply"></div>
			<div><h3>${hl(tr(g.name))}</h3><div class="small muted">${esc(tr(g.stat).replace(/:$/, ""))} · <code>${esc(key)}</code></div></div>
		</div>
		<p class="small" style="margin:10px 0 0">${esc(tr("GEM_DESC", { stat: tr(g.stat).replace(/:$/, ""), value: `${Math.round(depths[0] * 100)}–${Math.round(depths[depths.length - 1] * 100)}` }))}</p>
		</article>`);
	const table = `<div class="card wide"><h3>${ui("perDepth")}</h3>

		</table></div>
		<p class="small muted" style="margin:8px 0 0">${ui("choices")}: ${DATA.gems.choices ?? "?"}</p></div>`;
	return header("gems") + `<div class="grid">${cards.join("")}${table}</div>`;
}

			<div style="min-width:0"><h3>${hl(tr(r.name))}</h3>
				<div class="row small" style="margin-top:2px"><span class="tag">${esc(rarityName(r.rarity))}</span><code>${esc(id)}</code></div>
				<p style="margin:8px 0 0">${hl(tr(r.description))}</p>
			</div></div>
			${Object.entries(r.hooks || {}).map(([hook, code]) => `<p class="small" style="margin:10px 0 0"><span class="muted">${ui("hook")} <b>${esc(hook)}</b>:</span><br><code>${esc(code)}</code></p>`).join("")}

function renderUnlocks() {
	const ms = DATA.milestones.filter((m) => matches(m.key, tr(m.hint), ...DATA.mons.map((mon) => tr(mon.milestone_egg_skills?.[m.key]))));
	const bs = DATA.bounties.filter((b) => matches(b.key, tr(b.label, { mon: monName(b.mon) }), tr(b.hint), ...DATA.mons.map((mon) => tr(mon.bounty_egg_skills?.[b.key]))));
	const rewards = (field, key) => DATA.mons.filter((m) => m[field]?.[key])
		.map((m) => `<li>${esc(monName(m.name))}: ${skillLabel(m[field][key])}</li>`).join("");
	const msHtml = ms.map((m) => `<article class="card">
		<h3>${esc(m.count)}× ${esc(tr("MILESTONE_STAT_" + m.stat.toUpperCase()))}</h3>
		<p class="small muted" style="margin:4px 0 0">${hl(tr(m.hint))}</p>
		<div class="skill-group"><h4>${ui("reward")}</h4><ul class="skill-list">${rewards("milestone_egg_skills", m.key) || ui("none")}</ul></div>
	</article>`).join("");
	const bsHtml = bs.map((b) => `<article class="card">
		<h3>${hl(tr(b.label, { mon: monName(b.mon) }))}</h3>
		<dl class="kv">
			<dt>${ui("appearsFrom")}</dt><dd>${b.min_depth + 1}</dd>
			<dt>${ui("levelBonus")}</dt><dd>+${b.level_bonus}</dd>
		</dl>
		<p class="small muted" style="margin:8px 0 0">${hl(tr(b.hint))}</p>
		<div class="skill-group"><h4>${ui("reward")}</h4><ul class="skill-list">${rewards("bounty_egg_skills", b.key) || ui("none")}</ul></div>
	</article>`).join("");
	return header("unlocks") +
		`<h3 style="margin:0 0 10px">${ui("milestone")}</h3>${msHtml ? `<div class="grid">${msHtml}</div>` : `<div class="empty">${ui("noResults")}</div>`}
		<h3 style="margin:24px 0 4px">${ui("bounty")}</h3>
		<p class="small muted" style="margin:0 0 10px">${ui("bountyChance")}: ${pct(DATA.bountyChance || 0)}</p>
		${bsHtml ? `<div class="grid">${bsHtml}</div>` : `<div class="empty">${ui("noResults")}</div>`}`;

function renderMap() {
	const settings = Object.entries(DATA.map.settings);
	// Spalten aus den Daten, damit neue Feldtypen automatisch auftauchen
	const keys = [...new Set(settings.flatMap(([, s]) => Object.keys(s)))];
	const scalar = keys.filter((k) => settings.every(([, s]) => !Array.isArray(s[k])));
	const lists = keys.filter((k) => !scalar.includes(k));
	const nodeLabel = { bosses: "BOSS", tresures: "TREASURE", shops: "SHOP", trainers: "TRAINER", jailer: "JAILER", gems: "GEM", camps: "CAMP", events: "EVENT" };
	const label = (k) => ({ paths: ui("paths"), special_nodes: ui("special"), lines: ui("lines") }[k] ||
		(nodeLabel[k] ? tr("MAP_NODE_" + nodeLabel[k]) : k));
	const biomeTier = (i) => i === settings.length - 1 ? 4 : Math.min(1 + Math.round(i * 3 / Math.max(settings.length - 1, 1)), 3);
	const table = `<div class="table-wrap"><table>
		<thead><tr><th>${ui("depth")}</th><th>${ui("element")}</th>${scalar.map((k) => `<th class="num">${esc(label(k))}</th>`).join("")}${lists.map((k) => `<th>${esc(label(k))}</th>`).join("")}</tr></thead>
		<tbody>${settings.map(([d, s], i) => `<tr>
			<td><b>${Number(d) + 1}</b></td>
			<td class="small">${biomeTier(i)} ${biomeTier(i) === 1 ? ui("element") : ui("elements")}</td>
			${scalar.map((k) => `<td class="num">${s[k] ?? ""}</td>`).join("")}
			${lists.map((k) => `<td>${(s[k] || []).length ? s[k].join(", ") : `<span class="muted">${ui("none")}</span>`}</td>`).join("")}
		</tr>`).join("")}</tbody></table></div>`;
	const nodeTypes = Object.keys(DATA.enums.PATH_TYPE).filter((k) => tr("MAP_NODE_" + k + "_DESC") !== "MAP_NODE_" + k + "_DESC" && matches(tr("MAP_NODE_" + k), tr("MAP_NODE_" + k + "_DESC")));
	const nodeHtml = nodeTypes.map((k) => `<article class="card"><h3>${hl(tr("MAP_NODE_" + k))}</h3><p class="small" style="margin:6px 0 0">${hl(tr("MAP_NODE_" + k + "_DESC"))}</p></article>`).join("");
	return header("map") + table + `<p class="small muted" style="margin-top:12px">${ui("nodeRows")} · max_rows ${DATA.map.maxRows ?? "?"} · max_cols ${DATA.map.maxCols ?? "?"}</p>` +
		(nodeHtml ? `<h3 style="margin:24px 0 10px">${ui("nodeTypes")}</h3><div class="grid">${nodeHtml}</div>` : "");
}

function renderChrome() {

	document.getElementById("lang").innerHTML = DATA.langs.map((l) =>
		`<button data-lang="${l}" aria-pressed="${l === state.lang}">${l.toUpperCase()}</button>`).join("");
	document.getElementById("tabs").innerHTML = Object.entries(SECTIONS).map(([key, s]) =>
		`<button role="tab" data-tab="${key}" aria-selected="${key === state.tab}">${esc(ui(key))}<span class="count">${s.count()}</span></button>`).join("");
	const date = new Date(DATA.generatedAt);
	document.getElementById("footer").innerHTML = `${ui("generated")}: ${date.toLocaleString(state.lang)}${DATA.git ? ` · ${ui("commit")} <code>${esc(DATA.git)}</code>` : ""} · <code>node tools/wiki/build_wiki.js</code>`;
}

function render() {
	if (!SECTIONS[state.tab]) state.tab = "monsters";
	renderChrome();
	const warn = DATA.warnings?.length ? `<div class="warn"><b>${ui("warnings")}</b><ul>${DATA.warnings.map((w) => `<li>${esc(w)}</li>`).join("")}</ul></div>` : "";
	document.getElementById("main").innerHTML = warn + `<section>${SECTIONS[state.tab].render()}</section>`;
}

function applyTheme(theme) {
	if (theme === "auto") delete document.documentElement.dataset.theme;
	else document.documentElement.dataset.theme = theme;
	document.querySelectorAll("#theme button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.theme === theme)));
	localSet("wiki.theme", theme);
}

document.addEventListener("click", (e) => {
	const t = e.target.closest("button, th.sortable");
	if (!t) return;
	if (t.dataset.tab) {
		state.tab = t.dataset.tab;
		localSet("wiki.tab", state.tab);
		history.replaceState(null, "", "#" + state.tab);
		render();
		window.scrollTo({ top: 0 });
	} else if (t.dataset.lang) {
		state.lang = t.dataset.lang;
		localSet("wiki.lang", state.lang);
		render();
	} else if (t.dataset.theme) {
		applyTheme(t.dataset.theme);
	} else if (t.dataset.sort) {
		const s = state.skillSort;
		state.skillSort = { key: t.dataset.sort, dir: s.key === t.dataset.sort && s.dir === "asc" ? "desc" : "asc" };
		render();
	} else if (t.dataset.all !== undefined) {
		state.matrixAll = t.dataset.all === "1";
		render();
	}
});
document.addEventListener("change", (e) => {
	if (e.target.id === "f-element") state.skillElement = e.target.value;
	else if (e.target.id === "f-list") state.skillList = e.target.value;
	else return;
	render();
});
document.getElementById("search").addEventListener("input", (e) => {
	state.query = e.target.value.trim();
	const pos = e.target.selectionStart;
	render();
	e.target.focus();
	e.target.setSelectionRange(pos, pos);
});
window.addEventListener("hashchange", () => { state.tab = location.hash.slice(1); render(); });

applyTheme(localGet("wiki.theme") || "auto");
render();
</script>
</body>
</html>
